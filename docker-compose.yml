services:
  db:
    image: postgres:17-alpine
    container_name: goalup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goalup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goalup}
      POSTGRES_DB: ${POSTGRES_DB:-goalup}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - goalup_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goalup} -d ${POSTGRES_DB:-goalup}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  goalup_pg_data: